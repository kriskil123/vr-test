name: VWorld cloud connection test
on: workflow_dispatch
permissions: {}

jobs:
  inspect:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Click VWorld and capture one frame
        shell: python
        run: |
          import json
          import time
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright

          out = Path("probe-result")
          out.mkdir(exist_ok=True)
          report = {"stage": "open_kilmap", "sdk_requests": 0, "sdk_statuses": [], "captured": False}

          def save():
              (out / "status.json").write_text(json.dumps(report, indent=2))

          def is_sdk(url):
              u = urlsplit(url)
              return u.hostname == "map.vworld.kr" and u.path.endswith("/webglMapInit.js.do")

          def on_request(request):
              if is_sdk(request.url):
                  report["sdk_requests"] += 1
                  save()

          def on_response(response):
              if is_sdk(response.url):
                  report["sdk_statuses"].append(response.status)
                  save()

          def on_failure(request):
              if is_sdk(request.url):
                  report["sdk_network_error"] = request.failure
                  save()

          save()
          try:
              with sync_playwright() as pw:
                  browser = pw.chromium.launch(args=[
                      "--use-angle=swiftshader",
                      "--enable-unsafe-swiftshader"
                  ])
                  page = browser.new_page(viewport={"width": 1280, "height": 800})
                  page.on("request", on_request)
                  page.on("response", on_response)
                  page.on("requestfailed", on_failure)

                  url = "https://kilmap-mobile-study.kris335217.chatgpt.site/?map=3d&capture=1"
                  response = page.goto(url, wait_until="domcontentloaded", timeout=45000)
                  report["viewer_http"] = response.status if response else None
                  report["stage"] = "wait_for_site"
                  save()

                  page.wait_for_function(
                      """async () => Boolean((await import('./viewer.js')).modelReviewContext())""",
                      timeout=90000
                  )
                  report["stage"] = "click_vworld"
                  save()
                  page.locator("#viewWorld").click(timeout=10000)
                  report["stage"] = "wait_for_vworld"
                  save()

                  frame = page.locator("#stage.provider-ui iframe:not([hidden])")
                  ready = """() => {
                    const f = document.querySelector('#stage.provider-ui iframe:not([hidden])');
                    const scene = f?.contentWindow?.ws3d?.viewer?.scene;
                    return Boolean(scene?.globe && f.dataset.cameraConfirmed &&
                      f.dataset.groundAnchor &&
                      !f.contentDocument?.querySelector('.cesium-widget-errorPanel'));
                  }"""

                  deadline = time.monotonic() + 90
                  while time.monotonic() < deadline:
                      codes = report["sdk_statuses"]
                      if codes and codes[-1] >= 400:
                          report["stage"] = "sdk_http_error"
                          break
                      if report.get("sdk_network_error"):
                          report["stage"] = "sdk_network_error"
                          break
                      if 200 in codes and page.evaluate(ready):
                          page.wait_for_timeout(2000)
                          if page.evaluate(ready):
                              frame.screenshot(path=str(out / "vworld.png"), timeout=10000)
                              report.update(stage="vworld_captured", captured=True)
                              break
                      page.wait_for_timeout(300)
                  else:
                      report["stage"] = "vworld_timeout"
                  browser.close()
          except Exception as exc:
              report["error_type"] = type(exc).__name__
          finally:
              save()
              print(json.dumps(report), flush=True)

          raise SystemExit(0 if report["captured"] else 1)

      - name: Save VWorld result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vworld-network-check
          path: probe-result/
          retention-days: 1
