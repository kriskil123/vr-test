<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture 3D Heatmap Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        
        /* UI 패널 스타일 */
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        button, label.file-upload {
            padding: 12px 20px; background: rgba(255, 255, 255, 0.9); color: #333; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.2s; text-align: center;
            font-size: 14px;
        }
        button:hover, label.file-upload:hover { background: #fff; transform: translateY(-2px); }
        
        /* 파일 업로드 인풋 숨기기 */
        input[type="file"] { display: none; }
        
        /* 화면 중앙 시선(크로스헤어) 스타일 */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.8); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        
        /* 안내 텍스트 */
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 20px; font-weight: bold; z-index: 20; background: rgba(0,0,0,0.7); padding: 30px; border-radius: 10px; text-align: center;
        }
    </style>
</head>
<body>
    <div id="instructions">
        좌측 상단의 <b>[GLB 모델 열기]</b> 버튼을 눌러<br>라이노에서 추출한 모델을 선택해주세요.<br><br>
        <span style="font-size: 16px; font-weight: normal; color:#ddd;">마우스 드래그: 시야 회전 | 키보드 WASD: 앞뒤좌우 이동 | Q/E: 상하 이동</span>
    </div>
    <div id="crosshair" style="display:none;"></div>
    
    <div id="ui-container">
        <!-- 서버 없이 직접 파일을 브라우저로 밀어넣는 버튼 -->
        <label class="file-upload">
            GLB 모델 열기
            <input type="file" id="file-input" accept=".glb, .gltf">
        </label>
        
        <button id="btn-toggle" style="display:none;">히트맵 보이기 / 숨기기</button>
        <button id="btn-export" style="display:none;">CSV 데이터 추출 (Rhino용)</button>
    </div>

    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. 기본 씬 셋업
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x333333);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 조명 설정
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 3. 마우스 컨트롤 (우클릭 이동, 좌클릭 회전)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        // --- 추가된 키보드 이동 설정 ---
        const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false, KeyQ: false, KeyE: false };
        const moveSpeed = 0.05; // 이동 속도 (필요에 따라 이 숫자를 키우거나 줄이세요)

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });
        // ------------------------------

        let loadedModel = null;
        const heatmapData = {}; // 최적화를 위해 배열([])에서 오브젝트(Dictionary)로 변경
        const heatmapGroup = new THREE.Group();
        const GRID_SIZE = 0.5; // 공간을 50cm 단위로 묶어서 데이터 용량 극강 최적화
        scene.add(heatmapGroup);

        // --- 히트맵 표면 텍스처 (솔라 어낼리시스 스타일용 부드러운 브러시) ---
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.4, 'rgba(255,255,255,0.6)');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 128, 128);
        const brushTexture = new THREE.CanvasTexture(canvas);
        // -------------------------------------------------------------

        // 4. 로컬 파일 업로드 이벤트 (핵심 해결책)
        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // 로딩 메시지 변경
            document.getElementById('instructions').innerText = "모델을 불러오는 중입니다...";

            // 브라우저 메모리에 임시 URL 생성 (보안 에러 우회)
            const url = URL.createObjectURL(file);
            const loader = new GLTFLoader();

            loader.load(url, function (gltf) {
                // 기존 모델이 있다면 제거
                if (loadedModel) {
                    scene.remove(loadedModel);
                }

                loadedModel = gltf.scene;
                scene.add(loadedModel);

                // UI 업데이트
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('btn-toggle').style.display = 'block';
                document.getElementById('btn-export').style.display = 'block';
                
                // 임시 URL 해제 (메모리 관리)
                URL.revokeObjectURL(url);
            }, undefined, function (error) {
                console.error(error);
                document.getElementById('instructions').innerText = "오류 발생! 지원되지 않는 GLB 형식이거나 손상된 파일일 수 있습니다.";
            });
        });

        // 5. 레이캐스팅 (시선 추적 및 면(Surface) 분석)
        const raycaster = new THREE.Raycaster();
        const centerPoint = new THREE.Vector2(0, 0);

        function getHeatmapColor(weight) {
            if (weight < 5) return 0x0055ff;  // 파랑 (스쳐감)
            if (weight < 15) return 0x00ff00; // 초록
            if (weight < 30) return 0xffff00; // 노랑
            return 0xff0000;                  // 빨강 (오래 머뭄)
        }

        setInterval(() => {
            if (!loadedModel) return;

            raycaster.setFromCamera(centerPoint, camera);
            const intersects = raycaster.intersectObject(loadedModel, true);

            if (intersects.length > 0) {
                const intersect = intersects[0];
                const hitPoint = intersect.point;
                
                // [시각화 업그레이드] 벽/바닥의 법선(Normal) 방향을 계산하여 면에 착 달라붙게 함
                let worldNormal = new THREE.Vector3(0, 1, 0);
                if (intersect.face) {
                    const normalMatrix = new THREE.Matrix3().getNormalMatrix(intersect.object.matrixWorld);
                    worldNormal = intersect.face.normal.clone().applyMatrix3(normalMatrix).normalize();
                }

                // [용량 최적화] 공간을 50cm 격자(Grid)로 쪼개서 같은 면을 보면 하나의 데이터로 합침
                const qx = Math.round(hitPoint.x / GRID_SIZE) * GRID_SIZE;
                const qy = Math.round(hitPoint.y / GRID_SIZE) * GRID_SIZE;
                const qz = Math.round(hitPoint.z / GRID_SIZE) * GRID_SIZE;
                
                const nx = Math.round(worldNormal.x);
                const ny = Math.round(worldNormal.y);
                const nz = Math.round(worldNormal.z);
                
                // 구역을 대표하는 고유 키 생성
                const key = `${qx}_${qy}_${qz}_${nx}_${ny}_${nz}`;

                if (heatmapData[key]) {
                    // 이미 본 면이면 색상만 붉게 업데이트
                    heatmapData[key].weight += 1;
                    heatmapData[key].mesh.material.color.setHex(getHeatmapColor(heatmapData[key].weight));
                } else {
                    // 처음 본 면이면 넓은 판(Plane)을 생성하여 벽에 페인트처럼 칠함
                    const geometry = new THREE.PlaneGeometry(GRID_SIZE * 3, GRID_SIZE * 3);
                    const material = new THREE.MeshBasicMaterial({ 
                        map: brushTexture,
                        color: 0x0055ff, 
                        transparent: true, 
                        opacity: 0.8,
                        depthWrite: false, // 겹칠 때 깜빡이는 현상 방지
                        side: THREE.DoubleSide
                    });
                    
                    const splat = new THREE.Mesh(geometry, material);
                    
                    // 벽과 완전히 겹치지 않게 표면에서 아주 살짝(0.02) 띄움
                    const splatPos = new THREE.Vector3(qx, qy, qz);
                    splatPos.add(worldNormal.clone().multiplyScalar(0.02)); 
                    splat.position.copy(splatPos);
                    
                    // 판이 벽/바닥과 평행하도록 회전
                    splat.lookAt(splatPos.clone().add(worldNormal));

                    heatmapGroup.add(splat);

                    heatmapData[key] = {
                        position: new THREE.Vector3(qx, qy, qz),
                        normal: worldNormal,
                        weight: 1,
                        mesh: splat
                    };
                }
            }
        }, 100);

        // 6. UI 이벤트
        let heatmapVisible = true;
        document.getElementById('btn-toggle').addEventListener('click', () => {
            heatmapVisible = !heatmapVisible;
            heatmapGroup.visible = heatmapVisible;
        });

        document.getElementById('btn-export').addEventListener('click', () => {
            const keys = Object.keys(heatmapData);
            if (keys.length === 0) {
                alert("아직 수집된 시선 데이터가 없습니다.");
                return;
            }
            // CSV 헤더에 Normal(법선/각도) 데이터 추가
            let csvContent = "X,Y,Z,NormalX,NormalY,NormalZ,Weight\n";
            keys.forEach(key => {
                const data = heatmapData[key];
                csvContent += `${data.position.x.toFixed(3)},${data.position.y.toFixed(3)},${data.position.z.toFixed(3)},${data.normal.x.toFixed(3)},${data.normal.y.toFixed(3)},${data.normal.z.toFixed(3)},${data.weight}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "heatmap_surface_data.csv");
            link.click();
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            // --- 키보드 이동 로직 (WASD + QE) ---
            if (loadedModel) {
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0; // 시선을 위아래로 향해도 W/S는 수평으로만 걷도록 설정
                if (forward.lengthSq() > 0) forward.normalize();

                const right = new THREE.Vector3();
                right.crossVectors(forward, camera.up).normalize();

                const move = new THREE.Vector3();

                if (keys.KeyW) move.add(forward);
                if (keys.KeyS) move.sub(forward);
                if (keys.KeyA) move.sub(right);
                if (keys.KeyD) move.add(right);

                if (move.lengthSq() > 0) move.normalize().multiplyScalar(moveSpeed);

                // 수직 이동 (Q: 아래, E: 위)
                if (keys.KeyE) move.y += moveSpeed;
                if (keys.KeyQ) move.y -= moveSpeed;

                // 마우스 회전 중심축(target)도 같이 이동해야 자연스럽게 걸을 수 있습니다.
                camera.position.add(move);
                controls.target.add(move);
            }
            // ------------------------------------

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
